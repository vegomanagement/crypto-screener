name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (all modules)
        run: python -m py_compile decision.py llm_agents.py chart.py tracking.py screener.py webhook_server.py

      - name: Lint (ruff)
        # screener.py — legacy 4k-line file; игнорим стилистические
        # one-line if/else (E701/E702), оставляем только реальные баги.
        # --select закреплён явно: ruff>=0.6 расширяет набор правил по
        # умолчанию между релизами (подтверждено на main 2026-10-15:
        # неявный default-select вырос с E4/E7/E9/F до ~15 категорий,
        # включая YTT/ASYNC/S/B и т.д., без единого изменения кода).
        # Без явного --select CI начинает красниться от одного bump
        # ruff, а не от реальных регрессий в правках.
        run: |
          ruff check --select E4,E7,E9,F decision.py llm_agents.py chart.py tracking.py tests/
          ruff check --select E4,E7,E9,F screener.py --ignore E701,E702 webhook_server.py

      - name: Unit tests (pytest)
        run: pytest -v
